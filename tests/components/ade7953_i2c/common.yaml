sensor:
  - platform: ade7953_i2c
    id: ade7953_i2c_hub
    i2c_id: i2c_bus
    irq_pin: ${irq_pin}
    voltage:
      name: ADE7953 Voltage
      id: ade7953_i2c_voltage
    current_a:
      name: ADE7953 Current A
      id: ade7953_i2c_current_a
    current_b:
      name: ADE7953 Current B
      id: ade7953_i2c_current_b
    power_factor_a:
      name: ADE7953 Power Factor A
    power_factor_b:
      name: ADE7953 Power Factor B
    apparent_power_a:
      name: ADE7953 Apparent Power A
    apparent_power_b:
      name: ADE7953 Apparent Power B
    active_power_a:
      name: ADE7953 Active Power A
    active_power_b:
      name: ADE7953 Active Power B
    reactive_power_a:
      name: ADE7953 Reactive Power A
    reactive_power_b:
      name: ADE7953 Reactive Power B
    active_energy_a:
      name: ADE7953 Active Energy A
    active_energy_b:
      name: ADE7953 Active Energy B
      restore: false
    reactive_energy_a:
      name: ADE7953 Reactive Energy A
    reactive_energy_b:
      name: ADE7953 Reactive Energy B
    apparent_energy_a:
      name: ADE7953 Apparent Energy A
    apparent_energy_b:
      name: ADE7953 Apparent Energy B
    no_load_threshold: 0x720C
    invert_current_b: true
    update_interval: 1s

binary_sensor:
  - platform: ade7953_i2c
    ade7953_id: ade7953_i2c_hub
    no_load_a:
      name: ADE7953 No Load A
    no_load_b:
      name: ADE7953 No Load B
    reverse_power_a:
      name: ADE7953 Reverse Power A
    reverse_power_b:
      name: ADE7953 Reverse Power B
